<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventaire GéoConsulting</title>
  <meta name="description" content="Inventaire du matériel de laboratoire de GéoConsulting Sarl.">
  <meta name="theme-color" content="#0F2A24">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inventaire">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("gc-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot" role="status">
      <img src="icon.svg" alt="" width="64" height="64">
      <span>Chargement de l'inventaire…</span>
    </div>
  </div>
  <nav class="dock" id="dock" aria-label="Navigation principale" hidden></nav>
  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <div class="netbar" id="netbar" hidden>Hors connexion. Les modifications ne peuvent pas être enregistrées.</div>

  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
